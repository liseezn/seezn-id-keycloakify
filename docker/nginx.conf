# SeeZn ID edge nginx — serves the public site and proxies Keycloak on one origin.
#
# Topology (see docs/ARCHITECTURE.md):
#   https://auth.liseezn.top/            -> /usr/share/nginx/html (public-site/)
#   https://auth.liseezn.top/realms/...  -> keycloak:8080
#   https://auth.liseezn.top/resources/... -> keycloak:8080
#   https://auth.liseezn.top/admin/...    -> keycloak:8080
#   https://auth.liseezn.top/js/...       -> keycloak:8080
#   https://auth.liseezn.top/robots.txt   -> keycloak:8080
#
# TLS IS TERMINATED IN FRONT OF THIS CONTAINER. This server only listens on
# plain HTTP :80 and is published on 127.0.0.1:8080 by docker-compose.yml. Put
# host nginx / Caddy / Traefik on 80+443 for auth.liseezn.top and proxy to
# 127.0.0.1:8080, setting X-Forwarded-Proto: https (and X-Forwarded-Host).
# If you terminate TLS inside this container instead, add a 443 ssl server
# block (certificates mounted read-only) and a :80 -> :443 redirect; see
# docs/DEPLOYMENT.md §HTTPS.

# Docker's embedded DNS. Resolve `keycloak` per request so nginx recovers after
# the Keycloak container is recreated with a different IP.
resolver 127.0.0.11 valid=10s ipv6=off;

# Preserve the scheme/port as seen by the external TLS terminator. When there
# is no upstream proxy (local HTTP test), fall back to the local scheme/port.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $forwarded_proto $forwarded_port {
    default 443;
    http    $server_port;
}

# CSP only for the static site. Proxied Keycloak responses keep Keycloak's own
# Content-Security-Policy (it is stricter/different and required by the admin
# and account consoles). An empty add_header value is not sent by nginx.
map $uri $site_csp {
    default "";
    # The static pages share /assets/seezn.css and /assets/seezn.js with the
    # Keycloak theme design tokens. They still load Google Fonts and the lucide
    # icon CDN; self-host these later to drop the CDN origins.
    "/" "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    ~^/(index\.html|terms\.html|privacy\.html|terms|privacy|404\.html|favicon-32x32\.png)$ "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

# Access log with the real client IP taken from the TLS terminator, useful for
# the 90-day retention setup in docs/DEPLOYMENT.md.
log_format seezn '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'xff="$http_x_forwarded_for" host="$host"';
access_log /var/log/nginx/access.log seezn;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json
           application/xml image/svg+xml;

server {
    listen 80;
    server_name auth.liseezn.top;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Sent for both static and proxied responses as defence in depth. Keycloak
    # itself also sends HSTS / nosniff / SAMEORIGIN; duplicate identical values
    # are tolerated by browsers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy $site_csp always;

    # Variable + resolver = request-time DNS (see resolver above).
    set $keycloak_upstream http://keycloak:8080;

    # --- Keycloak same-origin paths -------------------------------------
    # Regex location matches /realms, /realms/, /realms/... and the same for
    # resources, admin and js. /js exists in some Keycloak versions/endpoints.
    location ~ ^/(realms|resources|admin|js)(/|$) {
        proxy_pass $keycloak_upstream;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # Keycloak serves a robots.txt that disallows the admin/account consoles.
    location = /robots.txt {
        proxy_pass $keycloak_upstream;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    # --- Static site -----------------------------------------------------
    # Internal SeeZn 404 page (status stays 404 for clients).
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires 1m;
    }

    # Home stays at /; legal pages use explicit .html entry points.
    location = /index.html { return 301 /; }
    location = /terms { return 301 /terms.html; }
    location = /privacy { return 301 /privacy.html; }

    # Vite emits content-hashed files under /assets/. Safe to cache for a year.
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
        access_log off;
    }

    # HTML entry points: short cache so a new deploy is visible quickly.
    location ~* \.html$ {
        expires 5m;
        try_files $uri =404;
    }

    location = / {
        expires 5m;
        try_files /index.html =404;
    }

    # No SPA history fallback; unknown paths must remain real 404s.
    location / {
        expires 5m;
        try_files $uri $uri/ =404;
    }

}
