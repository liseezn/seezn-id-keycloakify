name: acceptance

# Manual-only: this job builds the theme, starts Keycloak + a mock SMTP sink and
# Chromium. It is intentionally not wired to push/pull_request so it does not
# consume Actions minutes during normal development.
on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Optional Playwright grep filter (leave empty for all tests)"
        required: false
        default: ""

concurrency:
  group: acceptance
  cancel-in-progress: true

env:
  THEME_JAR: dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build theme JAR
        run: npm run build-keycloak-theme

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start mock SMTP
        run: |
          nohup node tests/e2e/mock-smtp.mjs > mock-smtp.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:1026/messages > /dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Start Keycloak with the built theme
        run: |
          docker run -d --name seezn-keycloak --network host \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/keycloak/realm-seezn.json:/opt/keycloak/data/import/realm-seezn.json:ro" \
            -v "$PWD/$THEME_JAR:/opt/keycloak/providers/seezn-id.jar:ro" \
            quay.io/keycloak/keycloak:26.8.2 start-dev --http-port=8100 --import-realm
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8100/realms/seezn/ > /dev/null && exit 0
            sleep 2
          done
          docker logs seezn-keycloak
          exit 1

      - name: Configure master realm themes
        run: |
          docker exec seezn-keycloak /opt/keycloak/bin/kcadm.sh \
            config credentials --server http://localhost:8100 --realm master \
            --user admin --password admin
          docker exec seezn-keycloak /opt/keycloak/bin/kcadm.sh \
            update realms/master -s loginTheme=seezn-id -s adminTheme=seezn-id

          CLIENT_ID="$(docker exec seezn-keycloak /opt/keycloak/bin/kcadm.sh \
            get clients -r master -q clientId=security-admin-console \
            --fields id --format csv --noquotes | tail -n 1)"
          docker exec seezn-keycloak /opt/keycloak/bin/kcadm.sh \
            update "clients/${CLIENT_ID}" -r master \
            -s attributes.login_theme=seezn-id

          docker restart seezn-keycloak
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8100/realms/master/ > /dev/null && exit 0
            sleep 2
          done
          docker logs seezn-keycloak
          exit 1

      - name: Run acceptance suite
        run: |
          set -o pipefail
          if [ -n "${{ inputs.grep }}" ]; then
            npm run test:e2e -- --grep "${{ inputs.grep }}" 2>&1 | tee /tmp/e2e.log
          else
            npm run test:e2e 2>&1 | tee /tmp/e2e.log
          fi

      - name: Summarize Playwright failures
        if: always()
        run: |
          node <<'NODE'
          const fs = require("fs");
          let report;
          try {
            report = JSON.parse(fs.readFileSync("artifacts/e2e-report.json", "utf8"));
          } catch {
            process.exit(0);
          }
          const lines = [];
          const visit = value => {
            if (!value || typeof value !== "object") return;
            if (Array.isArray(value.specs)) {
              for (const spec of value.specs) {
                for (const test of spec.tests ?? []) {
                  for (const result of test.results ?? []) {
                    if (result.status === "passed") continue;
                    const message = (result.error?.stack ?? result.error?.message ?? "failed")
                      .replace(/\r?\n/g, " | ")
                      .slice(0, 1500);
                    lines.push(`::error file=tests/e2e/acceptance.spec.ts,title=${spec.title}::${message}`);
                  }
                }
              }
            }
            for (const child of Object.values(value)) visit(child);
          };
          visit(report);
          if (lines.length === 0) {
            console.log("::error title=playwright::No report details found");
          } else if (lines.length === 1) {
            console.log(lines[0]);
          } else {
            // Keep annotations small: only the first failure is usually the root cause.
            console.log(lines[0]);
            console.log(`::warning title=playwright::${lines.length - 1} more failure(s) omitted from annotations`);
          }
          NODE

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: artifacts/e2e-report.json
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: docker rm --force seezn-keycloak || true
