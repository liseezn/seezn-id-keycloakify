name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  THEME_JAR: dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar

jobs:
  build:
    name: Build theme JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Build Keycloak theme JAR
        run: npm run build-keycloak-theme

      - name: Verify theme types
        run: |
          JAR="dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar"
          unzip -p "$JAR" META-INF/keycloak-themes.json
          unzip -p "$JAR" META-INF/keycloak-themes.json | grep -q '"login"'
          unzip -p "$JAR" META-INF/keycloak-themes.json | grep -q '"account"'
          unzip -l "$JAR" | grep -q 'theme/seezn-id/account/'
          unzip -l "$JAR" | grep -q 'theme/seezn-id/login/'
          echo "theme types OK: login + account"

      - name: Upload theme JAR
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-theme
          path: dist_keycloak/*.jar
          if-no-files-found: error

  check_if_version_upgraded:
    name: Check if version was upgraded
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    outputs:
      from_version: ${{ steps.step1.outputs.from_version }}
      to_version: ${{ steps.step1.outputs.to_version }}
      is_upgraded_version: ${{ steps.step1.outputs.is_upgraded_version }}
      is_pre_release: ${{ steps.step1.outputs.is_pre_release }}
    steps:
      - uses: garronej/ts-ci@v2.1.5
        id: step1
        with:
          action_name: is_package_json_version_upgraded
          branch: ${{ github.head_ref || github.ref }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build, check_if_version_upgraded]
    if: needs.check_if_version_upgraded.outputs.is_upgraded_version == 'true'
    permissions:
      contents: write
    steps:
      - name: Download theme JAR
        uses: actions/download-artifact@v4
        with:
          name: keycloak-theme
          path: dist_keycloak

      - uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ needs.check_if_version_upgraded.outputs.to_version }}
          tag_name: v${{ needs.check_if_version_upgraded.outputs.to_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.check_if_version_upgraded.outputs.is_pre_release == 'true' }}
          files: dist_keycloak/*.jar
